name: secret-scan

# 推送/PR 时扫描是否误提交密钥、私钥、Token。
# 另外补一道「加密源文件形态」自检（秒级、不装依赖）：
# build-check 的产物级 check:encrypted 已改成只在 PR 上跑，main 推送时由这个作业兜住
# 「带 passwordEnv 却没写回密文」这类最致命的泄漏。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # pin 到具体 commit 防投毒；只读扫描不需要凭据落地
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # 个人公开仓库无需 license；若提示需要 GITLEAKS_LICENSE，
      # 去 https://gitleaks.io 申请免费许可并存到仓库 Secret。
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  encryption-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # 纯 node 脚本、不装依赖，几秒钟跑完：加密文章必须已是密文形态、
      # 不得出现明文密码字段、passwordEnv 必须是 workflow 已映射的口令变量名。
      - name: 加密源文件自检
        run: node scripts/check-encryption-source.mjs
