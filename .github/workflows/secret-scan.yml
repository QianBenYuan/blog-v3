name: secret-scan

# 推送/PR 时扫描是否误提交密钥、私钥、Token
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 个人公开仓库无需 license；若提示需要 GITLEAKS_LICENSE，
      # 去 https://gitleaks.io 申请免费许可并存到仓库 Secret。
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
