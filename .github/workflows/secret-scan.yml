name: secret-scan

# 推送/PR 时扫描是否误提交密钥、私钥、Token
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # pin 到具体 commit 防投毒；只读扫描不需要凭据落地
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # 个人公开仓库无需 license；若提示需要 GITLEAKS_LICENSE，
      # 去 https://gitleaks.io 申请免费许可并存到仓库 Secret。
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
