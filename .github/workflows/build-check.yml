name: build-check

# 只在 PR 和手动触发时做完整构建 + 产物级泄漏自检（check:encrypted）。
# main 的 push 交给 Vercel 构建兜底，这里不再重复一遍全量 generate（每次白烧 3~5 分钟 runner）。
# 代价：main 推送不再有「产物级」检查，所以 push 时的加密源文件形态由
# secret-scan 的 encryption-source 作业（scripts/check-encryption-source.mjs）兜住。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4（版本读 package.json 的 packageManager）

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 注入口令 Secret 让加密在构建中真实发生（无 passwordEnv 的文章不受影响）；
      # 故意不设 ENCRYPT_BACKFILL——CI 里的源文件必须保持原样，绝不回写。
      - name: 构建（pnpm generate）
        env:
          MOECTF_PW: ${{ secrets.MOECTF_FLAG }}
          BLOG_DEV_PW: ${{ secrets.BLOG_DEV_PW }}
          TOOL_PW: ${{ secrets.TOOL_PW }}
        run: pnpm generate

      - name: 加密产物泄漏自检（check:encrypted）
        run: pnpm check:encrypted
